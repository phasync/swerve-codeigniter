name: 🧪 CI

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        # One entry per supported CodeIgniter version: worker mode came with 4.7
        framework: ["4.7"]

    name: ⚙️ CodeIgniter ${{ matrix.framework }} on PHP ${{ matrix.php }}

    env:
      # The adapter must behave the same with and without the extension, so the suite runs both ways
      PHASYNC_EXT_VERSION: 0.5.0-alpha8

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, posix, sockets, intl, mbstring, curl

      - name: 📥 Install dependencies
        run: composer install --no-progress --prefer-dist

      # Until swerve 0.1.0-alpha13: with*() on alpha12's messages clones a streamed body (phasync/swerve#3)
      - name: 📥 Check out swerve main
        run: git clone --depth 1 https://github.com/phasync/swerve "$RUNNER_TEMP/swerve"

      - name: 🏗️ Create the CodeIgniter ${{ matrix.framework }} test application
        run: SWERVE_PATH="$RUNNER_TEMP/swerve" tests/create-app.sh ${{ matrix.framework }}

      - name: 🔍 Check php-cs-fixer
        run: composer php-cs-fixer-dry-run

      - name: ✅ Tests
        run: vendor/bin/pest --stop-on-defect

      - name: 📥 Download phasync-ext
        run: |
          curl -fsSL -o "$RUNNER_TEMP/phasync.so" \
            "https://raw.githubusercontent.com/phasync/phasync-ext/$PHASYNC_EXT_VERSION/bin/phasync-${{ matrix.php }}-nts-x86_64-glibc.so"
          php -d extension="$RUNNER_TEMP/phasync.so" -r 'extension_loaded("phasync") || exit(1); echo "phasync-ext ", phpversion("phasync"), "\n";'

      - name: ✅ Tests with phasync-ext
        run: SWERVE_PHP_ARGS="-d extension=$RUNNER_TEMP/phasync.so" vendor/bin/pest --stop-on-defect
